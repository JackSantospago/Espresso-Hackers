name: field_assistant
description: "Offline farming assistant: on-device LLM + RAG + memory (Android & iOS)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.0'   # required by flutter_edge_ai_sqlite

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_edge_ai: ^1.11.4            # core API (formerly flutter_gemma)
  flutter_edge_ai_litertlm: ^1.8.6    # .litertlm LLM engine + embedding backend
  flutter_edge_ai_embeddings: ^2.2.1  # tokenizers for the embedding model
  flutter_edge_ai_sqlite: ^1.4.0      # on-device vector store (sqlite-vec)
  path_provider: ^2.1.4
  # Leaf photo check (on-device classifier) + store-and-forward to the extension officer
  tflite_flutter: ^0.12.1
  image_picker: ^1.2.0
  image: ^4.5.0
  http: ^1.2.0
  # Weather: farm location (once, rounded), "back online" refresh, background refresh
  geolocator: ^14.1.1
  connectivity_plus: ^7.3.1    # 7.3.2 needs a dbus version that clashes with geolocator_linux
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/knowledge/
    - assets/models/
  # Bundled so the app looks the same offline (SIL Open Font License, see assets/fonts/).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-500.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
